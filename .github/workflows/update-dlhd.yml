name: Auto Update DLHD M3U Playlist

on:
  schedule:
    # Runs daily at 11:52 PM IST (18:22 UTC)
    - cron: '22 18 * * *'
    # Also runs recurring every 45 minutes
    - cron: '*/45 * * * *'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run DaddyLive Extractor
        run: node generate_dlhd_m3u.cjs

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto-update dlhd.m3u playlist at 11:52 PM IST"
          git pull --rebase origin main
          git push
